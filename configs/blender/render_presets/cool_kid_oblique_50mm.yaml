version: 1
name: cool_kid_oblique_50mm

camera:
  object: Camera
  type: PERSP
  location: [-70.0, -320.0, 1460.0]
  rotation_degrees: [12.0, -0.000011, -12.0]
  lens_mm: 50.0
  clip_start: 0.163
  clip_end: 1995.0

lighting:
  sun:
    object: Sun
    strength: 5.0

color_management:
  view_transform: AgX
  look: AgX - High Contrast

render:
  engine: CYCLES
  samples: 1024
  denoise: false
  # Disable adaptive early termination so every pixel uses the requested count.
  adaptive_sampling: false
  file_format: PNG

output:
  directory: examples/aim/blender/renders/{example_name}

runs:
  - name: no_cladding
    hide_layers: [cladding]

  - name: all_layers
    hide_layers: []
