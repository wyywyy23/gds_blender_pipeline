version: 1
name: trx_top_oblique_100mm

camera:
  object: Camera
  type: PERSP
  location: [6050.0, 50.0, 10000.0]
  rotation_degrees: [29.527, 0.000012, 32.57]
  lens_mm: 100.0

lighting:
  sun:
    object: Sun
    strength: 5.0

color_management:
  view_transform: AgX
  look: AgX - High Contrast

render:
  engine: CYCLES
  samples: 1024
  denoise: false
  # Disable adaptive early termination so every pixel uses the requested count.
  adaptive_sampling: false
  file_format: PNG

output:
  directory: examples/aim/blender/renders/trx_top

runs:
  - name: no_backend_or_cladding
    hide_layers:
      - cbam
      - m1am
      - v1am
      - m2am
      - vaam
      - mlam
      - cladding

  - name: no_cladding
    hide_layers:
      - cladding

  - name: all_layers
    hide_layers: []
