version: 1
name: ramzi_oblique_100mm

camera:
  object: Camera
  type: PERSP
  location: [-110.0, -260.0, 400.0]
  rotation_degrees: [35.0, 0.0, -25.0]
  lens_mm: 100.0
  clip_start: 0.0818
  clip_end: 1110.0

lighting:
  sun:
    object: Sun
    strength: 5.0

color_management:
  view_transform: AgX
  look: AgX - High Contrast

render:
  engine: CYCLES
  device: GPU
  preview_samples: 64
  preview_denoise: true
  samples: 1024
  denoise: false
  # Disable adaptive early termination so every pixel uses the requested count.
  adaptive_sampling: false
  file_format: PNG

output:
  directory: examples/aim/blender/renders/{example_name}

runs:
  - name: no_cladding
    hide_layers: [cladding]

  - name: all_layers
    hide_layers: []
