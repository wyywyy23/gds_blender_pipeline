version: 1
name: trx_top_oblique_100mm_no_cladding_shadows

camera:
  object: Camera
  type: PERSP
  location: [6050.0, 50.0, 10000.0]
  rotation_degrees: [29.527, 0.000012, 32.57]
  lens_mm: 100.0

lighting:
  sun:
    object: Sun
    strength: 5.0

color_management:
  view_transform: AgX
  look: AgX - High Contrast

render:
  engine: CYCLES
  samples: 1024
  denoise: false
  # Disable adaptive early termination so every pixel uses the requested count.
  adaptive_sampling: false
  file_format: PNG

output:
  directory: examples/aim/blender/renders/trx_top_shadow_test

runs:
  - name: all_layers
    hide_layers: []
    # Keep the transparent cladding visible to camera/refraction rays while
    # preventing it from casting Cycles shadow rays.
    disable_shadow_layers:
      - CLADDING_RENDER
