name: AIM Marketing
description: Shiny monotone AIM render-layer color scheme
layers:
  # Graphite base.
  SUBSTRATE_BASE_RENDER: &substrate_silicon
    Base Color: [0.045, 0.043, 0.040, 1.0]
    Roughness: 0.52
    Metallic: 0.0
  SUBSTRATE_ETCHABLE_RENDER: *substrate_silicon

  # Polished clear cladding.
  CLADDING_RENDER:
    Base Color: [0.92, 0.97, 1.0, 0.18]
    Alpha: 0.18
    Roughness: 0.0
    Metallic: 0.0
    IOR: 1.45
    Transmission Weight: 0.82

  # Hidden by default after the cladding boolean; colored for debug display.
  CLADDING_UNDERCUT_CUTTER_RENDER:
    Base Color: [0.92, 0.94, 0.96, 0.30]
    Alpha: 0.28
    Roughness: 0.10
    Metallic: 0.0

  # Hidden after the bounded PAAM passivation-opening Boolean.
  CLADDING_PASSIVATION_CUTTER_RENDER:
    Base Color: [0.45, 0.95, 0.62, 0.34]
    Alpha: 0.34
    Roughness: 0.12
    Metallic: 0.0

  # Silicon: bright polished silver, with subtle cool n and warm p ladders.
  SEAM_I_BOTTOM_RENDER: &silicon_intrinsic
    Base Color: [0.84, 0.84, 0.82, 1.0]
