name: AIM Realistic
description: Realistic AIM render-layer color scheme
layers:
  # Substrate generated by scripts/aim_preprocess_gds.py.
  # GDS layer/datatype: 2000/0
  SUBSTRATE_BASE_RENDER: &substrate_silicon
    Base Color: [0.11, 0.105, 0.095, 1.0]
    Roughness: 0.72

  # Etchable substrate with TUAM_EXPANDED and DIAM already removed.
  # GDS layer/datatype: 2001/0
  SUBSTRATE_ETCHABLE_RENDER: *substrate_silicon

  # Clear oxide/glass cladding.
  # GDS layer/datatype: 2010/0
  CLADDING_RENDER:
    Base Color: [0.91, 0.98, 1.0, 0.16]
    Alpha: 0.16
    Roughness: 0.02
    Metallic: 0.0
    IOR: 1.45
    Transmission Weight: 0.86

  # Hidden by default after the cladding boolean; colored only for debug display.
  # GDS layer/datatype: 2050/0
  CLADDING_UNDERCUT_CUTTER_RENDER:
    Base Color: [0.85, 0.20, 0.10, 0.22]
    Alpha: 0.22
    Roughness: 0.35
    Metallic: 0.0

  # Hidden after the bounded PAAM passivation-opening Boolean.
  CLADDING_PASSIVATION_CUTTER_RENDER:
    Base Color: [0.15, 0.75, 0.30, 0.28]
    Alpha: 0.28
    Roughness: 0.35
    Metallic: 0.0

  # Silicon render layers. Doping polarity and rank are intentionally subtle;
  # the geometry carries the stack information, while the color remains realistic.
  SEAM_I_BOTTOM_RENDER: &silicon_intrinsic
    Base Color: [0.235, 0.24, 0.235, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_N10_BOTTOM_RENDER: &silicon_n10
    Base Color: [0.30, 0.365, 0.38, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_N20_BOTTOM_RENDER: &silicon_n20
    Base Color: [0.265, 0.325, 0.345, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_N30_BOTTOM_RENDER: &silicon_n30
    Base Color: [0.215, 0.275, 0.305, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_N70_BOTTOM_RENDER: &silicon_n70
    Base Color: [0.175, 0.235, 0.275, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_P10_BOTTOM_RENDER: &silicon_p10
    Base Color: [0.375, 0.315, 0.285, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_P12_BOTTOM_RENDER: &silicon_p12
    Base Color: [0.36, 0.30, 0.275, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_P15_BOTTOM_RENDER: &silicon_p15
    Base Color: [0.345, 0.285, 0.265, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_P20_BOTTOM_RENDER: &silicon_p20
    Base Color: [0.325, 0.265, 0.25, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_P25_BOTTOM_RENDER: &silicon_p25
    Base Color: [0.305, 0.245, 0.235, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_P30_BOTTOM_RENDER: &silicon_p30
    Base Color: [0.275, 0.215, 0.215, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_P70_BOTTOM_RENDER: &silicon_p70
    Base Color: [0.225, 0.165, 0.175, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_PN_CONFLICT_BOTTOM_RENDER: &pn_conflict
    Base Color: [0.75, 0.08, 0.32, 0.94]
    Alpha: 0.94
    Roughness: 0.40
    Metallic: 0.0

  SEAM_I_TOP_RENDER: *silicon_intrinsic
  SEAM_N10_TOP_RENDER: *silicon_n10
  SEAM_N12_TOP_RENDER: &silicon_n12
    Base Color: [0.285, 0.35, 0.365, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_N20_TOP_RENDER: *silicon_n20
  SEAM_N25_TOP_RENDER: &silicon_n25
    Base Color: [0.24, 0.30, 0.325, 0.98]
    Alpha: 0.98
    Roughness: 0.56
    Metallic: 0.0
  SEAM_N30_TOP_RENDER: *silicon_n30
  SEAM_N70_TOP_RENDER: *silicon_n70
  SEAM_P10_TOP_RENDER: *silicon_p10
  SEAM_P20_TOP_RENDER: *silicon_p20
  SEAM_P25_TOP_RENDER: *silicon_p25
  SEAM_P30_TOP_RENDER: *silicon_p30
  SEAM_P70_TOP_RENDER: *silicon_p70
  SEAM_PN_CONFLICT_TOP_RENDER: *pn_conflict

  REAM_I_RENDER: *silicon_intrinsic
  REAM_N10_RENDER: *silicon_n10
  REAM_N12_RENDER: *silicon_n12
  REAM_N20_RENDER: *silicon_n20
  REAM_N25_RENDER: *silicon_n25
  REAM_N30_RENDER: *silicon_n30
  REAM_N70_RENDER: *silicon_n70
  REAM_P10_RENDER: *silicon_p10
  REAM_P20_RENDER: *silicon_p20
  REAM_P25_RENDER: *silicon_p25
  REAM_P30_RENDER: *silicon_p30
  REAM_P70_RENDER: *silicon_p70
  REAM_PN_CONFLICT_RENDER: *pn_conflict

  RYAM_I_RENDER: *silicon_intrinsic
  RYAM_N10_RENDER: *silicon_n10
  RYAM_N12_RENDER: *silicon_n12
  RYAM_N20_RENDER: *silicon_n20
  RYAM_N25_RENDER: *silicon_n25
  RYAM_N30_RENDER: *silicon_n30
  RYAM_N70_RENDER: *silicon_n70
  RYAM_P10_RENDER: *silicon_p10
  RYAM_P20_RENDER: *silicon_p20
  RYAM_P25_RENDER: *silicon_p25
  RYAM_P30_RENDER: *silicon_p30
  RYAM_P70_RENDER: *silicon_p70
  RYAM_PN_CONFLICT_RENDER: *pn_conflict

  # Silicon nitride waveguide layers.
  FNAM_RENDER: &silicon_nitride_waveguide
    Base Color: [0.62, 0.56, 0.38, 0.96]
    Alpha: 0.96
    Roughness: 0.24
    Metallic: 0.0
    IOR: 2.0
    Transmission Weight: 0.04
  SNAM_RENDER: *silicon_nitride_waveguide

  # Backend materials follow configs/aim/render_layers.static.yaml:
  # CBAM is tungsten, M1/V1/M2 are copper, and VA/MLAM are aluminum.
  CBAM_RENDER:
    Base Color: [0.42, 0.44, 0.46, 1.0]
    Metallic: 0.90
    Roughness: 0.28

  M1AM_RENDER: &copper_backend
    Base Color: [0.80, 0.47, 0.27, 1.0]
    Metallic: 0.92
    Roughness: 0.24
  V1AM_RENDER:
    Base Color: [0.76, 0.44, 0.25, 1.0]
    Metallic: 0.92
    Roughness: 0.26
  M2AM_RENDER: *copper_backend

  VAAM_RENDER: &aluminum_backend
    Base Color: [0.74, 0.76, 0.78, 1.0]
    Metallic: 0.90
    Roughness: 0.26
  MLAM_RENDER:
    Base Color: [0.80, 0.82, 0.84, 1.0]
    Metallic: 0.90
    Roughness: 0.24

  PDK_BLACKBOX_RENDER:
    Base Color: [0.12, 0.12, 0.12, 0.35]
    Alpha: 0.35
    Roughness: 0.50
    Metallic: 0.0
